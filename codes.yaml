version: 1

ranges:
  common:
    start: 0
    end: 9999
    desc: Cross-service common codes
  words_core:
    start: 20000
    end: 20999
    desc: words_core business codes
  knowledge_core:
    start: 21000
    end: 21999
    desc: knowledge_core business codes

codes:
  - code: 0
    name: Success
    range: common
    msg_zh: 成功
    msg_en: ok
    http: 200

  - code: 1001
    name: LoginStatusExpired
    range: common
    msg_zh: 登录已过期
    msg_en: auth status expired
    http: 401

  - code: 1003
    name: PermissionDenied
    range: common
    msg_zh: 权限不足
    msg_en: permission denied
    http: 403

  - code: 4001
    name: BadRequest
    range: common
    msg_zh: 请求参数错误
    msg_en: bad request
    http: 400

  - code: 5001
    name: InternalServerError
    range: common
    msg_zh: 服务器内部错误
    msg_en: internal server error
    http: 500

  - code: 20001
    name: PackageNotFound
    range: words_core
    msg_zh: 词包不存在
    msg_en: package not found
    http: 404

  - code: 21001
    name: KnowledgeNameConflict
    range: knowledge_core
    msg_zh: 知识点名称已存在
    msg_en: knowledge name already exists
    http: 409

  - code: 21002
    name: VerifyCodeInvalid
    range: knowledge_core
    msg_zh: 验证码错误或已过期
    msg_en: verification code invalid or expired
    http: 400

  - code: 21003
    name: EmailAlreadyRegistered
    range: knowledge_core
    msg_zh: 邮箱已被注册
    msg_en: email already registered
    http: 409

  - code: 21004
    name: LoginFailed
    range: knowledge_core
    msg_zh: 邮箱或密码错误
    msg_en: email or password wrong
    http: 401

  - code: 21005
    name: VerifyCodeSendLimited
    range: knowledge_core
    msg_zh: 验证码发送过于频繁，请稍后再试
    msg_en: verification code sent too frequently
    http: 429

  - code: 21006
    name: TooManyLoginAttempts
    range: knowledge_core
    msg_zh: 尝试次数过多，请稍后再试
    msg_en: too many login attempts
    http: 429

  - code: 21007
    name: TreeNodeInvalid
    range: knowledge_core
    msg_zh: 树节点操作非法（移到自身子树下等）
    msg_en: tree node operation invalid
    http: 400

  - code: 21008
    name: TreeNodeNameConflict
    range: knowledge_core
    msg_zh: 同级下已存在同名节点
    msg_en: sibling node name conflict
    http: 409
